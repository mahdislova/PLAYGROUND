<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:FellSC;src:url(../fonts/IMFeENsc28P.ttf)}
@font-face{font-family:FellI;src:url(../fonts/IMFeENit28P.ttf)}
html,body{margin:0;width:1600px;height:2560px;overflow:hidden}
body{background:
  radial-gradient(ellipse 70% 45% at 50% 42%, #2b231c 0%, #16120f 70%),#16120f;
  color:#e9dfcc;font-family:FellSC,serif;text-align:center;position:relative}
.frame{position:absolute;inset:70px;border:3px solid #8a6f4e}
.frame:after{content:"";position:absolute;inset:16px;border:1px solid #8a6f4e}
.top{position:absolute;top:250px;left:0;right:0;font-family:FellI;font-size:64px;color:#b89a72;letter-spacing:2px}
.the{position:absolute;top:640px;left:0;right:0;font-size:120px;letter-spacing:40px;color:#b89a72}
.port,.rats{position:absolute;left:0;right:0;font-size:340px;line-height:1;letter-spacing:22px}
.port{top:800px}.rats{top:1130px}
.emb{position:absolute;top:1520px;left:250px;width:1100px}
.leaf{position:absolute;top:1860px;left:680px;width:240px}
.auth{position:absolute;bottom:230px;left:0;right:0;font-size:110px;letter-spacing:30px}
</style></head><body>
<div class="frame"></div>
<div class="top">a novel of the Lowers</div>
<div class="the">THE</div>
<div class="port">PORT</div>
<div class="rats">RATS</div>
<img class="emb" src="img/emblem-bone.svg">
<img class="leaf" src="img/ashleaf-bone.svg">
<div class="auth">PATRICK</div>
</body></html>
