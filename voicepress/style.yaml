# Your voice, written down. Every layer reads this file.
# Edit freely — the pipeline has no opinions you can't override here.

name: default

# Plain-language description of how you like your prose. Be specific.
voice: |
  Third person past, close on one character at a time.
  Grounded, physical, a little mean. Short declaratives mixed with long
  sentences that run on momentum, not commas-and-adjectives.
  Profanity when people would actually swear. No speeches.
  Dialogue carries subtext; nobody explains their feelings out loud.

# Hard rules the rewrite layers must obey.
rules:
  - Introduce new characters with concrete physical detail, but pick the three details that matter, not a catalog.
  - Sounds get spelled out phonetically when they matter (thunk, creak), at most once or twice a scene.
  - Never end a chapter or scene on a question.
  - Similes must come from the character's own world (a foundry man thinks in iron and heat).
  - Let some sentences be plain and flat. Not every line needs a hook.

# Passages of YOUR OWN writing. The voice layer imitates these.
# Paths are relative to this file. The more real samples, the better the match.
samples:
  - samples/my_voice.md

# Extra phrases you personally never want to see (added to the built-in list).
banned_phrases: []

# Phrases the linter flags by default that you actually like. They won't be flagged.
allowed_phrases: []

# Linter thresholds (per 1000 words unless noted).
thresholds:
  em_dashes_per_1k: 6
  similes_per_1k: 8
  triads_per_1k: 4
  fragment_runs_per_1k: 3
  min_sentence_length_cv: 0.55   # coefficient of variation of sentence lengths (rhythm)
  max_one_line_paragraph_ratio: 0.35

model: claude-opus-5-5
effort: high
